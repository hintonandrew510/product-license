<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
   xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
   <head>
      <meta charset="utf-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <title>Wizard</title>
      <meta name="description" content="">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="robots" content="all,follow">
      <link href="/css/bootstrap.min.css" rel="stylesheet">
      <script src="/js/bootstrap.bundle.min.js"></script>
  
     
   </head>
   <body>
      <!-- intro end-->
      <!-- navbar-->
      <header class="header">
     <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
            <div class="container">
               
               <div id="navbarSupportedContent" class="collapse navbar-collapse">
                  <ul class="navbar-nav ml-auto">
                     <li class="nav-item"><a href="/" class="nav-link link-scroll">Active</a></li>
                     <li class="nav-item"><a href="inActiveContracts" class="nav-link link-scroll">Inactive </a></li>
                     <li class="nav-item"><a href="allContracts" class="nav-link link-scroll">All</a></li>
                  </ul>
               </div>
            </div>
         </nav>
      </header>
      <section class="page-section clearfix">
         <!-- IF CUSTOMER IS ANONYMOUS -->
         <div class="container" style="background-color: white;color:black;">
            <h1  th:text="${contact?.name}"></h1>
           <form action="#" 
                 th:action="@{/update/{id}(id=${contact.contactId})}" 
            th:object="${contact}" 
  method="post">
                  <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">Name</label>
                <input th:field="*{name}" type="text" class="form-control" id="name">
            </div>
             <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Email address</label>
             
                <input th:field="*{emailaddress}" id="emailaddress" type="email" class="form-control" aria-describedby="emailHelp">
                <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
            </div>
         
            <div class="mb-3 form-check">
                <input th:field="*{active}" type="checkbox" class="form-check-input" id="active">
                <label class="form-check-label" for="exampleCheck1">Active</label>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
         </div>
      </section>
      <footer style="background-color: #111;">
         <div class="container">
            <div class="row copyright">
               <div class="col-md-6">
                  <p class="mb-md-0 text-center text-md-left">&copy;2025 The Guld Resource Group</p>
               </div>
               <div class="col-md-6">
                  <!-- Please do not remove the backlink to us. It is part of the licence conditions. Thanks for understanding :)-->
               </div>
            </div>
         </div>
      </footer>
      <!-- JavaScript files-->
     
   </body>
</html>
