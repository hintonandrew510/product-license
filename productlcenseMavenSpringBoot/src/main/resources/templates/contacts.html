<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
   xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
   <head>
      <meta charset="utf-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <title>Wizard</title>
      <meta name="description" content="">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="robots" content="all,follow">
      <link href="css/bootstrap.min.css" rel="stylesheet">
      <script src="js/bootstrap.bundle.min.js"></script>
  
     
   </head>
   <body>
      <!-- intro end-->
      <!-- navbar-->
      <header class="header">
     <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
            <div class="container">
               
               <div id="navbarSupportedContent" class="collapse navbar-collapse">
                  <ul class="navbar-nav ml-auto">
                     <li class="nav-item"><a href="/" class="nav-link link-scroll">Active</a></li>
                     <li class="nav-item"><a href="inActiveContracts" class="nav-link link-scroll">Inactive </a></li>
                     <li class="nav-item"><a href="allContracts" class="nav-link link-scroll">All</a></li>
                  </ul>
               </div>
            </div>
         </nav>
      </header>
      <section class="page-section clearfix">
         <!-- IF CUSTOMER IS ANONYMOUS -->
         <div class="container" style="background-color: white;color:black;">
            <h1  th:text="${contact?.name}"></h1>
            <a href="add.html" class="btn btn-primary btn-lg active" role="button" aria-pressed="true">Add Consultant</a> 
            <div th:if="${hasRows}">
               <table class="table table-striped">
                  <thead>
                     <tr>
                      
                        <th>Name</th>
                        <th>Email Address</th>
                        <th>Password</th>
                        <th>Address</th>
                        <th>Client Type</th>
                        
                        <th>Edit</th>
                        <th>Create License</th>
                        
                     </tr>
                  </thead>
                  <tbody>
                     <tr th:each="contact : ${contacts}">
                  
                        <td th:text="${contact.name}">2</td>
                        <td th:text="${contact.emailaddress}">2</td>
                        <td th:text="${contact.password}">2</td>
                        <td th:text="${contact.address}">2</td>
                          <td th:text="${contact.clientType}">2</td>
                        <td><a th:href="@{/edit/{id}(id=${contact.uuid})}">Edit</a></td>
                          <td><a th:href="@{/createlicense/{id}(id=${contact.uuid})}">Generate</a></td>
                     </tr>
                  </tbody>
               </table>
            </div>
            <!-- ELSE -->
            <div th:unless="${hasRows}">
               <h3>No Consultants Created</h3>
            </div>
         </div>
      </section>
      <footer style="background-color: #111;">
         <div class="container">
            <div class="row copyright">
               <div class="col-md-6">
                  <p class="mb-md-0 text-center text-md-left">&copy;2025 The Guld Resource Group</p>
               </div>
               <div class="col-md-6">
                  <!-- Please do not remove the backlink to us. It is part of the licence conditions. Thanks for understanding :)-->
               </div>
            </div>
         </div>
      </footer>
      <!-- JavaScript files-->
     
   </body>
</html>
