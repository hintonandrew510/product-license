<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
   xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
   <head>
      <meta charset="utf-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <title>Wizard</title>
      <meta name="description" content="">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="robots" content="all,follow">
      <link href="css/bootstrap.min.css" rel="stylesheet">
      <script src="js/bootstrap.bundle.min.js"></script>
      <!-- Favicon-->
      <link rel="shortcut icon" href="./img/icon.png">
     
   </head>
   <body>
      <!-- intro end-->
      <!-- navbar-->
      <header class="header">
     <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
            <div class="container">
               <a href="#intro" class="navbar-brand link-scroll"><img src="./img/system21.png" alt="" class="img-fluid" width="160" height="40"></a>
               <button type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation" class="navbar-toggler navbar-toggler-right"><i class="fa fa-bars"></i></button>
               <div id="navbarSupportedContent" class="collapse navbar-collapse">
                  <ul class="navbar-nav ml-auto">
                     <li class="nav-item"><a href="contacts" class="nav-link link-scroll">Home</a></li>
                     <li class="nav-item"><a href="agents" class="nav-link link-scroll">Consultants </a></li>
                     <li class="nav-item"><a href="logout" class="nav-link link-scroll">Logout</a></li>
                  </ul>
               </div>
            </div>
         </nav>
      </header>
      <section class="page-section clearfix">
         <!-- IF CUSTOMER IS ANONYMOUS -->
         <div class="container" style="background-color: white;color:black;">
            <h1  th:text="${contact?.name}"></h1>
            <a href="add.html" class="btn btn-primary btn-lg active" role="button" aria-pressed="true">Add Consultant</a> 
            <div th:if="${hasRows}">
               <table class="table table-striped">
                  <thead>
                     <tr>
                        <th>Id</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Password</th>
                        <th>Phone</th>
                        <th>Edit</th>
                        <th>Create License</th>
                        
                     </tr>
                  </thead>
                  <tbody>
                     <tr th:each="contact : ${contacts}">
                        <td th:text="${contact.uuid}">2</td>
                        <td th:text="${contact.name}">2</td>
                        <td th:text="${contact.emailaddress}">2</td>
                        <td th:text="${contact.password}">2</td>
                        <td th:text="${contact.phone}">2</td>
                        <td><a th:href="@{/edit/{id}(id=${contact.uuid})}">Edit</a></td>
                          <td><a th:href="@{/createlicense/{id}(id=${contact.uuid})}">Generate</a></td>
                     </tr>
                  </tbody>
               </table>
            </div>
            <!-- ELSE -->
            <div th:unless="${hasRows}">
               <h3>No Consultants Created</h3>
            </div>
         </div>
      </section>
      <footer style="background-color: #111;">
         <div class="container">
            <div class="row copyright">
               <div class="col-md-6">
                  <p class="mb-md-0 text-center text-md-left">&copy;2018 The Guld Resource Group</p>
               </div>
               <div class="col-md-6">
                  <!-- Please do not remove the backlink to us. It is part of the licence conditions. Thanks for understanding :)-->
               </div>
            </div>
         </div>
      </footer>
      <!-- JavaScript files-->
     
   </body>
</html>
